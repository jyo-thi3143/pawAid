<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawAid 🐾</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Main navigation for moving between PawAid views -->
  <nav class="navbar">
    <a href="#home" class="logo">PawAid</a>

    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#find-vet">Find a Vet</a>
      <a href="#submit-clinic">Submit a Clinic</a>
    </div>
  </nav>


  <!-- Home view introducing the PawAid application -->
  <header id="home" class="page-section active-section">

    <div class="hero">
      <div class="hero-copy">
        <h1>
          <span class="paw-icon" aria-hidden="true">🐾</span>
          PawAid
        </h1>

        <p>
          Free and affordable vet services for low-income pet owners in NYC
        </p>
      </div>

      <div class="hero-visual">
        <div class="hero-photo-wrap">
          <img
            src="cat-hero.jpg"
            alt="A curious calico cat"
            class="hero-photo"
          />
        </div>
      </div>
    </div>

  </header>


  <!-- Find a Vet view containing search filters and veterinary listings -->
  <section id="find-vet" class="page-section">

    <!-- Search and filter section for finding affordable veterinary services -->
    <div class="filters">

      <input
        type="text"
        id="zip-input"
        placeholder="Search by zip code..."
      />

      <select id="service-select">
        <option value="">All services</option>
        <option value="vaccines">Vaccines</option>
        <option value="spay">Spay</option>
        <option value="neuter">Neuter</option>
        <option value="checkup">Checkup</option>
        <option value="dental">Dental</option>
        <option value="emergency">Emergency</option>
      </select>

      <button id="search-btn">Search</button>
      <button id="clear-btn">Clear</button>

    </div>


    <!-- Vet listings displayed based on the user's search and filter choices -->
    <div class="listings">

      <div id="vet-container">

        <!-- Vet cards will be injected here by app.js -->
        <p id="loading-msg">Loading listings...</p>

      </div>

    </div>

  </section>


  <!-- Clinic submission view for adding a new veterinary listing -->
  <section id="submit-clinic" class="page-section submit-section">

    <h2>Know a clinic we missed?</h2>

    <p>Submit it here and we'll review it.</p>


    <form id="submit-form">

  <label for="name">Clinic name *</label>
  <input
    type="text"
    id="name"
    placeholder="Enter clinic name"
    required
  />

  <label for="address">Address *</label>
  <input
    type="text"
    id="address"
    placeholder="Enter street address"
    required
  />

  <label for="city">City *</label>
  <input
    type="text"
    id="city"
    placeholder="Enter city"
    required
  />

  <label for="state">State *</label>
  <input
    type="text"
    id="state"
    placeholder="e.g. NY"
    required
    maxlength="2"
  />

  <label for="zip">ZIP code *</label>
  <input
    type="text"
    id="zip"
    placeholder="Enter ZIP code"
    required
  />

  <label for="phone">Phone number *</label>
  <input
    type="tel"
    id="phone"
    placeholder="Enter phone number"
    required
  />

  <label for="website">Website (optional)</label>
  <input
    type="url"
    id="website"
    placeholder="https://example.com"
  />

  <label for="notes">Notes (optional)</label>
  <input
    type="text"
    id="notes"
    placeholder="Additional information"
  />


  <fieldset>
    <legend>Services offered:</legend>

    <div class="checkbox-group">

      <label>
        <input type="checkbox" value="vaccines" />
        Vaccines
      </label>

      <label>
        <input type="checkbox" value="spay" />
        Spay
      </label>

      <label>
        <input type="checkbox" value="neuter" />
        Neuter
      </label>

      <label>
        <input type="checkbox" value="checkup" />
        Checkup
      </label>

      <label>
        <input type="checkbox" value="dental" />
        Dental
      </label>

      <label>
        <input type="checkbox" value="emergency" />
        Emergency
      </label>

    </div>
  </fieldset>


  <label class="free-label">

    <input
      type="checkbox"
      id="isFree"
    />

    This clinic offers FREE services

  </label>


  <button type="submit">
    Submit Listing
  </button>

</form>


    <p id="form-message"></p>

  </section>


  <!-- Footer shared across the PawAid application -->
  <footer>
    <p>PawAid - CISC 4900, Brooklyn College 2026</p>
  </footer>


  <!-- Load app.js after the HTML so all page elements are available -->
  <script src="app.js"></script>

</body>
</html>
